<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coach Dashboard</title>

<style>
body{
background:black;
color:white;
font-family:Arial;
padding:20px;
}

h1{
color:gold;
text-align:center;
}

.student{
border:1px solid gold;
padding:15px;
margin:15px 0;
border-radius:10px;
}

button{
background:gold;
color:black;
border:none;
padding:10px;
margin:5px;
border-radius:5px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>Coach Dashboard</h1>

<h2 style="color:gold">New Admission</h2>

<input id="newId" placeholder="Student ID"><br><br>

<input id="newName" placeholder="Student Name"><br><br>

<input id="newPhone" placeholder="Phone"><br><br>

<input id="newPlan" placeholder="Plan"><br><br>

<input id="newFee" placeholder="Total Fee"><br><br>

<button onclick="addStudent()">
Add Student
</button>

<br><br>
<div id="students"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const SUPABASE_URL =
"https://agwbczkxafdywztqmvib.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnd2Jjemt4YWZkeXd6dHFtdmliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjU5NzQsImV4cCI6MjA5NTgwMTk3NH0.VAKG7LJQOtxrGjG5habyv-P0UWsOqmGK7Vd9gx5mdQo";


const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

loadStudents();

async function loadStudents(){

const { data, error } = await supabaseClient
.from("students")
.select("*");

let html = "";

data.forEach(student => {

html += `
<div class="student">

<h3>${student.name}</h3>

<p>ID: ${student.student_id}</p>

<p>Attendance: ${student.attendance}</p>
<button onclick="markPresent('${student.student_id}')">
Mark Present
</button>
<button onclick="addFee('${student.student_id}')">
Add ₹100 Fee
</button>
<button onclick="addFee50('${student.student_id}')">
Add ₹50 Fee
</button>

<button onclick="addFee10('${student.student_id}')">
Add ₹10 Fee
</button>
<button onclick="payFee('${student.student_id}')">
Fee Paid ₹100
</button>
<button onclick="removeFee50('${student.student_id}')">
Remove ₹50 Fee
</button>
<button onclick="removeFee100('${student.student_id}')">
Remove ₹100 Fee
</button>
<p>Paid Fee: ₹${student.paid_fee}</p>
<p>Pending Fee: ₹${student.pending_fee}</p>

</div>
`;
});

document.getElementById("students").innerHTML = html;

}
async function markPresent(studentId){

await supabaseClient
.from("attendance")
.insert([
{
student_id: studentId,
status: "Present"
}
]);
const { data } = await supabaseClient
.from("students")
.select("attendance")
.eq("student_id", studentId)
.single();

await supabaseClient
.from("students")
.update({
attendance: Number(data.attendance || 0) + 1
})
.eq("student_id", studentId);
alert("Attendance Saved");
loadStudents();

}
async function addFee(studentId){

const { data } = await supabaseClient
.from("students")
.select("pending_fee")
.eq("student_id", studentId)
.single();

await supabaseClient
.from("students")
.update({
pending_fee: Number(data.pending_fee || 0) + 100
})
.eq("student_id", studentId);

loadStudents();

}
async function payFee(studentId){

const { data } = await supabaseClient
.from("students")
.select("paid_fee,pending_fee")
.eq("student_id", studentId)
.single();

await supabaseClient
.from("students")
.update({
paid_fee: Number(data.paid_fee || 0) + 100,
pending_fee: Math.max(
0,
Number(data.pending_fee || 0) - 100
)
})
.eq("student_id", studentId);

loadStudents();

}
async function removeFee100(studentId){

const { data } = await supabaseClient
.from("students")
.select("pending_fee")
.eq("student_id", studentId)
.single();

await supabaseClient
.from("students")
.update({
pending_fee: Math.max(
0,
Number(data.pending_fee || 0) - 100
)
})
.eq("student_id", studentId);

loadStudents();

}
async function addStudent(){

const studentId =
document.getElementById("newId").value;

const name =
document.getElementById("newName").value;

const phone =
document.getElementById("newPhone").value;

const plan =
document.getElementById("newPlan").value;

const fee =
document.getElementById("newFee").value;

await supabaseClient
.from("students")
.insert([
{
student_id: studentId,
password: "123456",
name: name,
phone: phone,
plan: plan,
paid_fee: 0,
pending_fee: fee,
attendance: 0
}
]);

alert("Student Added");

loadStudents();

}
</script>

</body>
</html>
