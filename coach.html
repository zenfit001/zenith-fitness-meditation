<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Login</title>

<style>
body{
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.box{
background:#111;
padding:30px;
border-radius:20px;
border:2px solid gold;
width:350px;
text-align:center;
}

h1{
color:gold;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:none;
}

button{
width:100%;
padding:12px;
background:gold;
border:none;
border-radius:10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>COACH LOGIN</h1>

<input type="text" placeholder="Coach ID">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>
</html>
