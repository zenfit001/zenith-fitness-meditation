<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Login</title>

<style>
body{
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.box{
background:#111;
padding:30px;
border-radius:20px;
border:2px solid gold;
width:350px;
text-align:center;
color:white;
}

h1{
color:gold;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:none;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:gold;
border:none;
border-radius:10px;
font-weight:bold;
}

#result{
margin-top:20px;
}
</style>
</head>

<body>

<div class="box">

<h1>COACH LOGIN</h1>

<input type="text" id="coachId" placeholder="Coach ID">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://agwbczkxafdywztqmvib.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnd2Jjemt4YWZkeXd6dHFtdmliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjU5NzQsImV4cCI6MjA5NTgwMTk3NH0.VAKG7LJQOtxrGjG5habyv-P0UWsOqmGK7Vd9gx5mdQo";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function login(){

const coachId =
document.getElementById("coachId").value;

const password =
document.getElementById("password").value;

const { data, error } = await supabaseClient
.from("coaches")
.select("*")
.eq("coach_id", coachId)
.eq("password", password);

if(error || !data || data.length === 0){

document.getElementById("result").innerHTML =
"<h3 style='color:red'>Invalid Login</h3>";

return;
}

const coach = data[0];

window.location.href = "coach-dashboard.html";

}

</script>

</body>
