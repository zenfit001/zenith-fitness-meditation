<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZENITH Admission Form</title>
<style>

body{
margin:0;
padding:20px;

background:#050505;

color:white;

font-family:'Segoe UI',sans-serif;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

min-height:100vh;
}

h1{
color:#FFD700;

font-size:42px;

text-align:center;

text-shadow:
0 0 10px gold,
0 0 25px gold;
}

p{
color:#ccc;
text-align:center;
font-size:18px;
}
.form-card{

width:100%;
max-width:500px;

background:#111;

padding:25px;

border-radius:20px;

border:1px solid rgba(255,215,0,.3);

box-shadow:
0 0 20px rgba(255,215,0,.15);

margin-top:30px;
}

.form-card input{

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:12px;

background:#1a1a1a;

color:white;

font-size:16px;
}

.form-card input:focus{

outline:none;

border:1px solid gold;

box-shadow:0 0 10px gold;
}
.form-card select{

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:12px;

background:#1a1a1a;

color:white;

font-size:16px;
}

.form-card select:focus{

outline:none;

border:1px solid gold;

box-shadow:0 0 10px gold;
}
.submit-btn{

width:100%;

padding:15px;

margin-top:15px;

background:#FFD700;

color:black;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;
}

.submit-btn:hover{

transform:scale(1.03);

box-shadow:
0 0 20px gold,
0 0 40px rgba(255,215,0,.5);
}
.mentor-note{

margin-top:15px;

padding:15px;

text-align:center;

font-size:14px;

line-height:1.7;

color:#ccc;

background:rgba(255,215,0,.08);

border:1px solid rgba(255,215,0,.2);

border-radius:12px;
}
</style>
</head>

<body>

<h1>ZENITH Admission Form</h1>

<p>
Fill your details below to apply for admission.
</p>
<form name="admission" method="POST" data-netlify="true">
<input type="hidden" name="form-name" value="admission">
<div class="form-card">

<input type="text" name="fullname" placeholder="Full Name">
<input type="text" name="fathername" placeholder="Father's Name">

<input type="tel" name="mobile" placeholder="Mobile Number">
<input type="email" name="email" placeholder="Email Address">

<input type="number" name="age" placeholder="Age">
<input type="text" name="address" placeholder="Address">
<select name="course">

<option>Select Course</option>

<option>Fitness</option>

<option>Running</option>

<option>Meditation</option>

<option>Army PET</option>

<option>Police PET</option>

<option>Senior Citizen Batch</option>

</select>
<select name="batch">

<option>Select Batch</option>

<option>Morning Batch</option>

<option>Evening Batch</option>

</select>
<button type="submit" class="submit-btn">
Submit Application
</button>
</button>
<p class="mentor-note">

📞 Your Mentor will call you at a convenient time to discuss training, batch timing and admission details.

No payment is required at this stage.

</p>
</div>
</form>
</body>
</html>
