<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZENITH Admission Form</title>
<style>

body{
margin:0;
padding:20px;

background:#050505;

color:white;

font-family:'Segoe UI',sans-serif;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

min-height:100vh;
}

h1{
color:#FFD700;

font-size:42px;

text-align:center;

text-shadow:
0 0 10px gold,
0 0 25px gold;
}

p{
color:#ccc;
text-align:center;
font-size:18px;
}
.form-card{

width:100%;
max-width:500px;

background:#111;

padding:25px;

border-radius:20px;

border:1px solid rgba(255,215,0,.3);

box-shadow:
0 0 20px rgba(255,215,0,.15);

margin-top:30px;
}

.form-card input{

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:12px;

background:#1a1a1a;

color:white;

font-size:16px;
}

.form-card input:focus{

outline:none;

border:1px solid gold;

box-shadow:0 0 10px gold;
}
.form-card select{

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:12px;

background:#1a1a1a;

color:white;

font-size:16px;
}

.form-card select:focus{

outline:none;

border:1px solid gold;

box-shadow:0 0 10px gold;
}
</style>
</head>

<body>

<h1>ZENITH Admission Form</h1>

<p>
Fill your details below to apply for admission.
</p>
<div class="form-card">

<input type="text" placeholder="Full Name">

<input type="tel" placeholder="Mobile Number">

<input type="email" placeholder="Email Address">

<input type="number" placeholder="Age">
<select>

<option>Select Course</option>

<option>Fitness</option>

<option>Running</option>

<option>Meditation</option>

<option>Army PET</option>

<option>Police PET</option>

<option>Senior Citizen Batch</option>

</select>
</div>
</body>
</html>
