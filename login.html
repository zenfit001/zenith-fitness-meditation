<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zenith Student Login</title>

<style>
body{
background:#000;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
width:90%;
max-width:400px;
background:#111;
padding:30px;
border-radius:20px;
border:2px solid gold;
box-shadow:0 0 20px gold;
text-align:center;
}

h1{
color:gold;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:gold;
color:black;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
}

#result{
margin-top:20px;
}
</style>
</head>

<body>

<div class="login-box">

<h1>ZENITH LOGIN</h1>

<input type="text" id="studentId" placeholder="Student ID">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://agwbczkxafdywztqmvib.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnd2Jjemt4YWZkeXd6dHFtdmliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjU5NzQsImV4cCI6MjA5NTgwMTk3NH0.VAKG7LJQOtxrGjG5habyv-P0UWsOqmGK7Vd9gx5mdQo";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function login(){

const studentId =
document.getElementById("studentId").value;

const password =
document.getElementById("password").value;

const { data, error } = await supabaseClient
.from("students")
.select("*")
.eq("student_id", studentId)
.eq("password", password);

if(error){
document.getElementById("result").innerHTML =
"<h3 style='color:red'>Database Error</h3>";
return;
}

if(!data || data.length === 0){
document.getElementById("result").innerHTML =
"<h3 style='color:red'>Invalid ID or Password</h3>";
return;
}

const student = data[0];

document.getElementById("result").innerHTML = `
<h3 style="color:gold">Welcome ${student.name}</h3>

<p><b>Plan:</b> ${student.plan}</p>

<p><b>Paid Fee:</b> ₹${student.paid_fee}</p>

<p><b>Pending Fee:</b> ₹${student.pending_fee}</p>

<p><b>Attendance:</b> ${student.attendance}</p>

<p><b>Phone:</b> ${student.phone}</p>
`;

}

</script>

</body>
</html>
